<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계절 생물 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="map"></div>
  <div id="map-overlays">
    <aside id="map-legend" aria-label="범례" hidden>
      <ul id="legend-rows">
        <li id="legend-real-track">
          <span class="legend-swatch" aria-hidden="true"></span>
          <span id="legend-real-track-text"></span>
        </li>
        <li id="legend-estimated">
          <span class="legend-swatch legend-swatch--estimated" aria-hidden="true"></span>
          <span id="legend-estimated-text"></span>
        </li>
      </ul>
      <p id="legend-source"></p>
    </aside>
    <div id="status-messages">
      <p id="error-message" role="alert" hidden></p>
      <p id="empty-month-message" hidden>이 달에는 표시할 곳이 없습니다.</p>
    </div>
  </div>
  <div id="topic-filter" role="group" aria-label="볼거리" hidden></div>
  <div id="side-column">
    <section id="date-calendar" aria-label="날짜 선택" hidden>
      <button type="button" id="calendar-toggle" aria-expanded="false" aria-controls="calendar-body"></button>
      <div id="calendar-body">
        <div id="calendar-header">
          <button type="button" id="calendar-prev" aria-label="이전 달">&#9664;</button>
          <p id="calendar-title" aria-live="polite"></p>
          <button type="button" id="calendar-next" aria-label="다음 달">&#9654;</button>
        </div>
        <div id="calendar-weekdays" aria-hidden="true"></div>
        <div id="calendar-grid" role="group" aria-label="날짜"></div>
        <div id="calendar-footer">
          <button type="button" id="play-toggle" aria-pressed="false" hidden></button>
          <button type="button" id="calendar-today">오늘</button>
        </div>
      </div>
    </section>
    <aside id="info-panel" hidden>
      <button type="button" id="info-panel-close" aria-label="닫기">&times;</button>
      <p id="info-panel-topic"></p>
      <h2 id="info-panel-title"></h2>
      <div id="info-panel-body"></div>
    </aside>
  </div>
</body>
</html>
